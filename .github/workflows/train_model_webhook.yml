name: Logistics AI Cloud Engine

on:
  workflow_dispatch:  # This allows it to be triggered by an API call from Google Sheets

jobs:
  run-ai-model:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # 3. Install required Python packages
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy xgboost scikit-learn gspread oauth2client

    # 4. Inject Google Cloud Credentials securely from GitHub Secrets
    - name: Prepare Google Credentials
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        echo "$GCP_CREDENTIALS" > mcp-sheets-key.json

    # 5. Execute the Cloud Engine
    - name: Run Logistics AI
      env:
        GOOGLE_APPLICATION_CREDENTIALS: mcp-sheets-key.json
      run: python scripts/train_cloud_model.py
