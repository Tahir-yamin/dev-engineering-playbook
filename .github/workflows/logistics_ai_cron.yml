
name: Logistics AI Cloud Engine

on:
  schedule:
    # Run automatically every day at 23:00 UTC (4:00 AM Pakistan Standard Time)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  run-ai-training:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install AI Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client pandas numpy xgboost scikit-learn

    - name: Inject Google Credentials Securely
      run: |
        echo '${{ secrets.GOOGLE_SHEETS_KEY }}' > credentials.json

    - name: Execute v14.0 Quantum Momentum Training
      env:
        GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      run: |
        python scripts/train_cloud_model.py
